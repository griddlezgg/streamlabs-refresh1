<html>
<body style="margin:0; padding:0; overflow:hidden; background:black;">
<img id="img" src="https://drive.google.com/thumbnail?id=1MUMfzLWS9Qhg-yYH1rmM4ldaKPsYL_QO" style="width:100%; height:auto;">
<script>
setInterval(() => {
  const img = document.getElementById("img");

}, 3000); // refresh every 3 seconds
</script>
</body>
</html>
